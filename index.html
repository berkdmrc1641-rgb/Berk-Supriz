<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="style.css">
</head>

<body class="login-body">

<!-- 🔥 MÜZİK ARTIK BURADA -->
<audio id="bgm" autoplay loop muted>
    <source src="music/sarki1.mp3" type="audio/mpeg">
</audio>

<div class="login-box">
    <h2>Hoş Geldin 💗</h2>
    <input id="pass" type="password" placeholder="Şifre">
    <button onclick="login()">Giriş Yap</button>
    <p id="err"></p>
</div>

<script>
// 🔥 Mobilde müziği açan ana kod
document.addEventListener("touchstart", () => {
    const audio = document.getElementById("bgm");
    audio.muted = false;
    audio.play().catch(()=>{});
}, { once:true });

// 🔥 Girişte de müziği aç (ek garanti)
function login() {
    const p = document.getElementById("pass").value;

    const audio = document.getElementById("bgm");
    audio.muted = false;
    audio.play().catch(()=>{});

    if (p === "2728") {
        window.location.href = "letter.html";
    } else {
        document.getElementById("err").innerText = "Yanlış şifre";
    }
}
</script>

</body>
</html>
