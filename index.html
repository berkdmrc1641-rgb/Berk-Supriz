<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="style.css">
</head>

<body class="login-body">

<!-- MÜZİK İFRAME -->
<iframe id="musicframe" src="musicplayer.html" style="display:none;"></iframe>

<div class="login-box">
    <h2>Hoş Geldin 💗</h2>
    <input id="pass" type="password" placeholder="Şifre">
    <button onclick="login()">Giriş Yap</button>
    <p id="err"></p>
</div>

<script>
// 🔥 MOBİLDE MÜZİĞİ AÇAN ANA KOD
document.addEventListener("touchstart", () => {
    const frame = document.getElementById("musicframe");
    const audio = frame.contentWindow.document.getElementById("bgm");

    audio.muted = false;
    audio.play().catch(()=>{});
}, { once:true });

// 🔥 GİRİŞTE DE MÜZİĞİ AÇ (EK GARANTİ)
function login() {
    const p = document.getElementById("pass").value;

    const frame = document.getElementById("musicframe");
    const audio = frame.contentWindow.document.getElementById("bgm");

    audio.muted = false;
    audio.play().catch(()=>{});

    if (p === "2728") {
        window.location.href = "letter.html";
    } else {
        document.getElementById("err").innerText = "Yanlış şifre";
    }
}
</script>

</body>
</html>
