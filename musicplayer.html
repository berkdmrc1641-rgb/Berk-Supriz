<!DOCTYPE html>
<html>
<body>

<audio id="bgm" autoplay loop muted>
    <source src="music/sarki1.mp3" type="audio/mpeg">
</audio>

<script>
const playlist = [
    "music/sarki1.mp3",
    "music/sarki2.mp3",
    "music/sarki3.mp3",
    "music/sarki4.mp3"
];

let current = 0;
const audio = document.getElementById("bgm");

// Mobil autoplay fix
document.addEventListener("touchstart", () => {
    audio.muted = false;
    audio.play();
}, { once:true });

// Playlist
audio.addEventListener("ended", () => {
    current++;
    if (current >= playlist.length) current = 0;
    audio.src = playlist[current];
    audio.play();
});
</script>
<script>
document.addEventListener("touchstart", () => {
    const a = document.getElementById("bgm");
    a.muted = false;
    a.play().catch(()=>{});
}, { once:true });
</script>

</body>
</html>
