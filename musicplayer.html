<!DOCTYPE html>
<html>
<body>

<audio id="bgm" autoplay loop muted>
    <source src="music/sarki1.mp3" type="audio/mpeg">
</audio>

<script>
const audio = document.getElementById("bgm");

// 🔥 PLAYLIST
const playlist = [
    "music/sarki1.mp3",
    "music/sarki2.mp3",
    "music/sarki3.mp3",
    "music/sarki4.mp3"
];

let current = 0;

audio.addEventListener("ended", () => {
    current++;
    if (current >= playlist.length) current = 0;
    audio.src = playlist[current];
    audio.play().catch(()=>{});
});
</script>

</body>
</html>
